<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>संविधान Revision — Schedules & Articles | GS Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f5ff;
      --surface: #ffffff;
      --surface-2: #eff6ff;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbeafe;
    }
    html.dark {
      --bg: #070b14;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .surface-card {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .duo-btn {
      border-bottom-width: 4px;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease;
    }
    .duo-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D Flip Card Styles */
    .flip-scene {
      perspective: 1100px;
      min-height: 230px;
    }
    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 230px;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .flip-card.flipped {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
      background: var(--surface);
      border-width: 2.5px;
      border-style: solid;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.15rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .flip-back {
      transform: rotateY(180deg);
      overflow-y: auto;
    }
    .drill-card {
      border-radius: 1.25rem;
      background: var(--surface);
      border-width: 2.5px;
      border-style: solid;
      min-height: 230px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .drill-card:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 surface-card border-x-0 border-t-0 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="index.html" class="px-3 py-2 rounded-xl text-xs font-extrabold border transition hover:opacity-85 flex items-center gap-1" style="border-color:var(--border); background:var(--surface-2)">
          ← GS Master
        </a>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg leading-tight tracking-tight text-blue-600 dark:text-blue-400">
            संविधान Revision
          </h1>
          <p class="text-[11px] font-semibold" style="color:var(--muted)">12 Schedules • Articles • Sub-Articles</p>
        </div>
      </div>

      <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-xl border flex items-center justify-center text-base transition" style="border-color:var(--border); background:var(--surface-2)" title="Toggle Light / Dark Mode">
        🌙
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1">

    <!-- Mode Switcher + Search -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
      <div class="grid grid-cols-2 gap-2.5 sm:w-auto">
        <button onclick="switchMode('schedules')" id="btn-schedules" class="duo-btn px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold border-2 transition flex items-center justify-center gap-2">
          <span>📑</span><span>12 Schedules</span>
        </button>
        <button onclick="switchMode('articles')" id="btn-articles" class="duo-btn px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold border-2 transition flex items-center justify-center gap-2">
          <span>📜</span><span>Articles</span>
        </button>
      </div>

      <div class="relative flex-1 sm:max-w-xs">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm opacity-60">🔍</span>
        <input
          type="text"
          id="searchInput"
          oninput="renderView()"
          placeholder="Search Art 21, Writ, भाषा, 73rd..."
          class="w-full pl-9 pr-4 py-2.5 rounded-2xl text-xs sm:text-sm font-semibold border outline-none focus:ring-2 focus:ring-blue-500/40"
          style="background:var(--surface); border-color:var(--border); color:var(--text)"
        />
      </div>
    </div>

    <!-- Articles Controls (Part Filter Pills + Sub-Articles Breadcrumb) -->
    <section id="articlesControls" class="hidden mb-5">
      <!-- Part Filter Pills -->
      <div id="partFilterWrap">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-extrabold uppercase tracking-wider" style="color:var(--muted)">भाग (Part) चुनें</span>
          <span id="countPill" class="text-[11px] font-bold px-2.5 py-0.5 rounded-lg" style="background:var(--surface-2); color:var(--muted)">0 Cards</span>
        </div>
        <div id="partPills" class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"></div>
      </div>

      <!-- Sub-Articles Breadcrumb Bar -->
      <div id="subBreadcrumbBar" class="hidden surface-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 border-2 border-blue-500/40">
        <div class="flex items-center gap-3">
          <button onclick="closeSubArticles()" class="duo-btn px-4 py-2 rounded-xl bg-blue-600 border-blue-800 text-white text-xs font-extrabold">
            ← सभी Articles
          </button>
          <div>
            <div id="subParentNum" class="text-xs font-extrabold text-blue-600 dark:text-blue-400"></div>
            <h2 id="subParentTitle" class="font-extrabold text-sm sm:text-base leading-snug"></h2>
          </div>
        </div>
        <span id="subCountBadge" class="text-xs font-extrabold px-3 py-1 rounded-xl bg-blue-500/15 text-blue-600 dark:text-blue-400"></span>
      </div>
    </section>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <script>
    const STORAGE_THEME = "gs_master_theme_v2";

    // Vibrant 4-Sided Border Color Palette
    const COLOR_MAP = {
      blue:    { border: "#2563eb", badgeBg: "rgba(37,99,235,0.12)",  badgeText: "#2563eb", glow: "0 10px 25px -6px rgba(37,99,235,0.28)" },
      emerald: { border: "#10b981", badgeBg: "rgba(16,185,129,0.12)", badgeText: "#059669", glow: "0 10px 25px -6px rgba(16,185,129,0.28)" },
      amber:   { border: "#f59e0b", badgeBg: "rgba(245,158,11,0.13)", badgeText: "#d97706", glow: "0 10px 25px -6px rgba(245,158,11,0.28)" },
      rose:    { border: "#f43f5e", badgeBg: "rgba(244,63,94,0.12)",  badgeText: "#e11d48", glow: "0 10px 25px -6px rgba(244,63,94,0.28)" },
      red:     { border: "#ef4444", badgeBg: "rgba(239,68,68,0.12)",  badgeText: "#dc2626", glow: "0 10px 25px -6px rgba(239,68,68,0.28)" },
      violet:  { border: "#8b5cf6", badgeBg: "rgba(139,92,246,0.12)", badgeText: "#7c3aed", glow: "0 10px 25px -6px rgba(139,92,246,0.28)" },
      cyan:    { border: "#06b6d4", badgeBg: "rgba(6,182,212,0.12)",  badgeText: "#0891b2", glow: "0 10px 25px -6px rgba(6,182,212,0.28)" },
      orange:  { border: "#f97316", badgeBg: "rgba(249,115,22,0.12)", badgeText: "#ea580c", glow: "0 10px 25px -6px rgba(249,115,22,0.28)" },
      teal:    { border: "#14b8a6", badgeBg: "rgba(20,184,166,0.12)", badgeText: "#0d9488", glow: "0 10px 25px -6px rgba(20,184,166,0.28)" },
      indigo:  { border: "#6366f1", badgeBg: "rgba(99,102,241,0.12)", badgeText: "#4f46e5", glow: "0 10px 25px -6px rgba(99,102,241,0.28)" },
      pink:    { border: "#ec4899", badgeBg: "rgba(236,72,153,0.12)", badgeText: "#db2777", glow: "0 10px 25px -6px rgba(236,72,153,0.28)" }
    };

    let constitutionData = { schedules: [], articles: [] };
    let currentMode = "schedules"; // 'schedules' | 'articles'
    let activePart = "All";
    let activeParentArticle = null; // When drilling into subArticles

    function getThemeColor(key) {
      return COLOR_MAP[key] || COLOR_MAP.blue;
    }

    // Theme Sync
    function initTheme() {
      if (localStorage.getItem(STORAGE_THEME) === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("themeBtn").textContent = "☀️";
      }
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(STORAGE_THEME, isDark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
    }

    // Load data/constitution.json silently from GitHub
    async function loadData() {
      const grid = document.getElementById("cardsGrid");
      grid.innerHTML = `<div class="col-span-full surface-card rounded-3xl p-10 text-center text-sm font-bold" style="color:var(--muted)">संविधान कार्ड्स लोड हो रहे हैं...</div>`;
      try {
        const res = await fetch("data/constitution.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Not found");
        constitutionData = await res.json();
        switchMode("schedules");
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full surface-card rounded-3xl p-10 text-center max-w-md mx-auto">
            <div class="text-4xl mb-2">📜</div>
            <h3 class="font-extrabold text-base mb-1">Content Jald Hi Aayega</h3>
            <p class="text-xs" style="color:var(--muted)">Schedules aur Articles ka revision data abhi load nahi ho paaya. Kripya thodi der baad dobara check karein.</p>
          </div>`;
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      activeParentArticle = null;

      const btnS = document.getElementById("btn-schedules");
      const btnA = document.getElementById("btn-articles");
      [btnS, btnA].forEach(b => {
        b.classList.remove("bg-blue-600", "text-white", "border-blue-800");
        b.classList.add("surface-card");
      });
      const activeBtn = mode === "schedules" ? btnS : btnA;
      activeBtn.classList.remove("surface-card");
      activeBtn.classList.add("bg-blue-600", "text-white", "border-blue-800");

      const ctrl = document.getElementById("articlesControls");
      if (mode === "articles") {
        ctrl.classList.remove("hidden");
        renderPartPills();
      } else {
        ctrl.classList.add("hidden");
      }
      renderView();
    }

    function renderPartPills() {
      const parts = ["All"];
      (constitutionData.articles || []).forEach(a => {
        if (a.part && !parts.includes(a.part)) parts.push(a.part);
      });
      const wrap = document.getElementById("partPills");
      wrap.innerHTML = parts.map(p => {
        const active = p === activePart;
        return `<button onclick="selectPart('${p}')" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition ${
          active ? 'bg-blue-600 text-white border-blue-700 shadow-sm' : 'surface-card hover:border-blue-400'
        }">${p}</button>`;
      }).join("");
    }

    function selectPart(part) {
      activePart = part;
      activeParentArticle = null;
      renderPartPills();
      renderView();
    }

    function openSubArticles(artIndex) {
      const list = getFilteredArticles();
      activeParentArticle = list[artIndex];
      document.getElementById("partFilterWrap").classList.add("hidden");
      document.getElementById("subBreadcrumbBar").classList.remove("hidden");
      document.getElementById("subParentNum").textContent = `${activeParentArticle.num} • ${activeParentArticle.part || ''}`;
      document.getElementById("subParentTitle").textContent = activeParentArticle.title;
      document.getElementById("subCountBadge").textContent = `${activeParentArticle.subArticles.length} Sub-Articles`;
      renderView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeSubArticles() {
      activeParentArticle = null;
      document.getElementById("subBreadcrumbBar").classList.add("hidden");
      document.getElementById("partFilterWrap").classList.remove("hidden");
      renderView();
    }

    function getFilteredArticles() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      return (constitutionData.articles || []).filter(a => {
        const partOk = activePart === "All" || a.part === activePart;
        if (!partOk) return false;
        if (!q) return true;
        const hay = `${a.num} ${a.part || ''} ${a.title} ${a.front || ''} ${a.back || ''} ${a.trick || ''}`.toLowerCase();
        const subHay = (a.subArticles || []).map(s => `${s.num} ${s.title} ${s.front} ${s.back}`).join(" ").toLowerCase();
        return hay.includes(q) || subHay.includes(q);
      });
    }

    function buildFlipCard(item, badgeLabel) {
      const c = getThemeColor(item.color);
      return `
        <div class="flip-scene">
          <div class="flip-card" onclick="this.classList.toggle('flipped')">
            <!-- Front -->
            <div class="flip-face" style="border-color:${c.border};" onmouseenter="this.style.boxShadow='${c.glow}'" onmouseleave="this.style.boxShadow='none'">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2.5">
                  <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg" style="background:${c.badgeBg}; color:${c.badgeText}">${item.num}</span>
                  ${badgeLabel ? `<span class="text-[11px] font-bold" style="color:var(--muted)">${badgeLabel}</span>` : ''}
                </div>
                <h3 class="font-extrabold text-base leading-snug mb-2">${item.title}</h3>
                <p class="text-xs font-semibold leading-relaxed" style="color:var(--muted)">${item.front || ''}</p>
              </div>
              <div class="pt-3 mt-2 border-t flex items-center justify-between text-[11px] font-bold" style="border-color:var(--border); color:${c.badgeText}">
                <span>🔄 Tap to Flip</span>
                <span>उत्तर देखें →</span>
              </div>
            </div>
            <!-- Back -->
            <div class="flip-face flip-back" style="border-color:${c.border}; box-shadow:${c.glow};">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg" style="background:${c.badgeBg}; color:${c.badgeText}">${item.num}</span>
                  <span class="text-[10px] font-extrabold uppercase tracking-wider" style="color:var(--muted)">विवरण</span>
                </div>
                <p class="text-xs sm:text-[13px] font-semibold leading-relaxed mb-3">${item.back || ''}</p>
              </div>
              ${item.trick ? `
                <div class="text-[11px] font-bold p-2.5 rounded-xl" style="background:${c.badgeBg}; color:${c.badgeText}">
                  💡 ${item.trick}
                </div>` : `
                <div class="text-[11px] font-bold opacity-60 text-right">🔄 Tap to flip back</div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function buildDrillCard(item, idx) {
      const c = getThemeColor(item.color);
      const subCount = item.subArticles.length;
      return `
        <div class="drill-card" onclick="openSubArticles(${idx})" style="border-color:${c.border};" onmouseenter="this.style.boxShadow='${c.glow}'" onmouseleave="this.style.boxShadow='none'">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg" style="background:${c.badgeBg}; color:${c.badgeText}">${item.num}</span>
              <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full" style="background:${c.badgeBg}; color:${c.badgeText}">${subCount} Sub-Cards</span>
            </div>
            <h3 class="font-extrabold text-base leading-snug mb-2">${item.title}</h3>
            <p class="text-xs font-semibold leading-relaxed mb-2" style="color:var(--muted)">${item.front || ''}</p>
            ${item.trick ? `<p class="text-[11px] font-bold" style="color:${c.badgeText}">💡 ${item.trick}</p>` : ''}
          </div>
          <div class="pt-3 mt-2 border-t flex items-center justify-between text-xs font-extrabold" style="border-color:var(--border); color:${c.badgeText}">
            <span>📂 Sub-Articles खोलें</span>
            <span>→</span>
          </div>
        </div>
      `;
    }

    function renderView() {
      const grid = document.getElementById("cardsGrid");
      const q = document.getElementById("searchInput").value.trim().toLowerCase();

      // 1. Sub-Articles Drill-Down View
      if (currentMode === "articles" && activeParentArticle) {
        const subs = activeParentArticle.subArticles.filter(s => {
          if (!q) return true;
          return `${s.num} ${s.title} ${s.front} ${s.back}`.toLowerCase().includes(q);
        });
        grid.innerHTML = subs.length
          ? subs.map(s => buildFlipCard(s, activeParentArticle.num)).join("")
          : `<div class="col-span-full surface-card rounded-2xl p-8 text-center text-sm font-semibold" style="color:var(--muted)">कोई Sub-Article नहीं मिला।</div>`;
        return;
      }

      // 2. Schedules View
      if (currentMode === "schedules") {
        const list = (constitutionData.schedules || []).filter(s => {
          if (!q) return true;
          return `${s.num} ${s.title} ${s.front} ${s.back} ${s.trick || ''}`.toLowerCase().includes(q);
        });
        grid.innerHTML = list.length
          ? list.map(s => buildFlipCard(s, "अनुसूची")).join("")
          : `<div class="col-span-full surface-card rounded-2xl p-8 text-center text-sm font-semibold" style="color:var(--muted)">कोई Schedule नहीं मिली।</div>`;
        return;
      }

      // 3. Articles View
      const list = getFilteredArticles();
      document.getElementById("countPill").textContent = `${list.length} Cards`;
      if (!list.length) {
        grid.innerHTML = `<div class="col-span-full surface-card rounded-2xl p-8 text-center text-sm font-semibold" style="color:var(--muted)">कोई Article नहीं मिला।</div>`;
        return;
      }

      grid.innerHTML = list.map((a, idx) => {
        if (a.subArticles && a.subArticles.length > 0) {
          return buildDrillCard(a, idx);
        }
        return buildFlipCard(a, a.part || "");
      }).join("");
    }

    initTheme();
    loadData();
  </script>
</body>
</html>
