<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Notes Library | GS Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f5ff;
      --surface: #ffffff;
      --surface-2: #eff6ff;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbeafe;
    }
    html.dark {
      --bg: #070b14;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .surface-card {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .duo-btn {
      border-bottom-width: 4px;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease;
    }
    .duo-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 surface-card border-x-0 border-t-0 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="index.html" class="px-3 py-2 rounded-xl text-xs font-extrabold border transition hover:opacity-85 flex items-center gap-1" style="border-color:var(--border); background:var(--surface-2)">
          ← GS Master
        </a>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg leading-tight tracking-tight text-blue-600 dark:text-blue-400">
            📚 PDF Notes Library
          </h1>
          <p class="text-[11px] font-semibold" style="color:var(--muted)">Original Class Notes • 1-Click Download</p>
        </div>
      </div>

      <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-xl border flex items-center justify-center text-base transition" style="border-color:var(--border); background:var(--surface-2)" title="Toggle Theme">
        🌙
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1">

    <!-- Subject Pills & Search -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
      <div id="subjectPills" class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"></div>

      <div class="relative sm:w-72 shrink-0">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm opacity-60">🔍</span>
        <input
          type="text"
          id="searchInput"
          oninput="renderList()"
          placeholder="Search Lecture, Topic..."
          class="w-full pl-9 pr-4 py-2.5 rounded-2xl text-xs sm:text-sm font-semibold border outline-none focus:ring-2 focus:ring-blue-500/40"
          style="background:var(--surface); border-color:var(--border); color:var(--text)"
        />
      </div>
    </div>

    <!-- Count Bar -->
    <div class="flex items-center justify-between mb-3">
      <span id="subjectHeading" class="text-xs font-extrabold uppercase tracking-wider" style="color:var(--muted)">Polity Notes</span>
      <span id="pdfCountBadge" class="text-[11px] font-extrabold px-2.5 py-1 rounded-lg bg-blue-500/15 text-blue-600 dark:text-blue-400">0 PDFs</span>
    </div>

    <!-- PDF Cards Grid -->
    <div id="pdfGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <script>
    const STORAGE_THEME = "gs_master_theme_v2";

    const SUBJECTS = [
      { key: "polity",    name: "Polity",    icon: "⚖️" },
      { key: "history",   name: "History",   icon: "🏛️" },
      { key: "geography", name: "Geography", icon: "🌍" },
      { key: "static_gk", name: "Static GK", icon: "🎯" },
      { key: "science",   name: "Science",   icon: "🔬" },
      { key: "economics", name: "Economics", icon: "📊" }
    ];

    const FALLBACK_DATA = {"polity": [{"lec": "Lec 01", "title": "संविधान निर्माण (Making of Constitution)", "sub": "संविधान सभा, समितियाँ, सत्र व प्रारूप समिति", "file": "pdfs/polity/lec1.pdf"}, {"lec": "Lec 02", "title": "संविधान की प्रमुख विशेषताएँ व अनुसूचियाँ", "sub": "संघवाद, 12 अनुसूचियाँ (TEARS OF OLD PM)", "file": "pdfs/polity/lec2.pdf"}, {"lec": "Lec 03", "title": "प्रस्तावना (Preamble & Parts)", "sub": "उद्देशिका, टिप्पणियाँ, केस व संविधान के 25 भाग", "file": "pdfs/polity/lec3.pdf"}, {"lec": "Lec 04", "title": "भाग I — संघ और उसका राज्यक्षेत्र", "sub": "अनुच्छेद 1–4, राज्य पुनर्गठन व अनुच्छेद 371", "file": "pdfs/polity/lec4.pdf"}, {"lec": "Lec 05", "title": "भाग II — नागरिकता (Citizenship)", "sub": "अनुच्छेद 5–11, नागरिकता अधिनियम 1955, OCI व CAA", "file": "pdfs/polity/lec5.pdf"}, {"lec": "Lec 06", "title": "भाग III — मौलिक अधिकार (Part-1)", "sub": "अनुच्छेद 12–18, समानता का अधिकार व Landmark Cases", "file": "pdfs/polity/lec6.pdf"}, {"lec": "Lec 07", "title": "भाग III — मौलिक अधिकार (Part-2)", "sub": "अनुच्छेद 19–21A, स्वतंत्रता व जीवन का अधिकार", "file": "pdfs/polity/lec7.pdf"}, {"lec": "Lec 08", "title": "भाग III — मौलिक अधिकार (Part-3)", "sub": "अनुच्छेद 22–35, धर्म, अल्पसंख्यक व 5 रिट (Writs)", "file": "pdfs/polity/lec8.pdf"}, {"lec": "Lec 09", "title": "भाग IV — राज्य के नीति निदेशक सिद्धांत (DPSP)", "sub": "अनुच्छेद 36–51, UCC, संशोधन व FR बनाम DPSP", "file": "pdfs/polity/lec9.pdf"}, {"lec": "Lec 10", "title": "मौलिक कर्तव्य व संविधान संशोधन", "sub": "अनुच्छेद 51A (11 कर्तव्य), बहुमत के प्रकार व Art 368", "file": "pdfs/polity/lec10.pdf"}, {"lec": "Lec 11", "title": "राष्ट्रपति और उपराष्ट्रपति", "sub": "अनुच्छेद 52–71, चुनाव, महाभियोग व कार्यकाल", "file": "pdfs/polity/lec11.pdf"}, {"lec": "Lec 12", "title": "प्रधानमंत्री, मंत्रिपरिषद व महान्यायवादी", "sub": "अनुच्छेद 72–78, क्षमादान शक्ति व Attorney General", "file": "pdfs/polity/lec12.pdf"}, {"lec": "Lec 13", "title": "भाग V — संसद (Part-1)", "sub": "अनुच्छेद 79–85, लोकसभा, राज्यसभा, परिसीमन व सत्र", "file": "pdfs/polity/lec13.pdf"}, {"lec": "Lec 14", "title": "भाग V — संसद (Part-2)", "sub": "अनुच्छेद 86–106, पदाधिकारी, कोरम, दलबदल व विशेषाधिकार", "file": "pdfs/polity/lec14.pdf"}, {"lec": "Lec 15", "title": "भाग V — संसद (Part-3)", "sub": "अनुच्छेद 107–123, विधेयक, वीटो, बजट, समितियाँ व अध्यादेश", "file": "pdfs/polity/lec15.pdf"}, {"lec": "Lec 16", "title": "राज्य कार्यपालिका व विधानमंडल", "sub": "अनुच्छेद 152–213, राज्यपाल, CM, विधानसभा व विधान परिषद", "file": "pdfs/polity/lec16.pdf"}, {"lec": "Lec 17", "title": "सर्वोच्च न्यायालय (Supreme Court)", "sub": "अनुच्छेद 124–147, कॉलेजियम, क्षेत्राधिकार व पूर्ण न्याय", "file": "pdfs/polity/lec17.pdf"}, {"lec": "Lec 18", "title": "उच्च न्यायालय, अधीनस्थ न्यायालय व अधिकरण", "sub": "अनुच्छेद 214–237, रिट (226), लोक अदालत, PIL व CAT", "file": "pdfs/polity/lec18.pdf"}, {"lec": "Lec 19", "title": "स्थानीय स्वशासन (Local Government)", "sub": "पंचायत (243–243O), नगरपालिका (243P–ZG) व सहकारी समितियाँ", "file": "pdfs/polity/lec19.pdf"}, {"lec": "Lec 20", "title": "केंद्र-राज्य संबंध (Center-State Relations)", "sub": "विधायी (245–255), प्रशासनिक (256–263), वित्तीय (265–293) व क्षेत्रीय परिषदें", "file": "pdfs/polity/lec20.pdf"}, {"lec": "Lec 21", "title": "संवैधानिक व गैर-संवैधानिक निकाय", "sub": "ECI, UPSC, वित्त आयोग, GST परिषद, CAG, NCSC/ST/BC, NHRC, लोकपाल, नीति आयोग", "file": "pdfs/polity/lec21.pdf"}, {"lec": "Lec 22", "title": "आपातकाल, राजभाषा, UT व जनजातीय क्षेत्र", "sub": "अनुच्छेद 352–360, 343–351, 239–242 व 244–244A", "file": "pdfs/polity/lec22.pdf"}, {"lec": "Lec 23", "title": "ऐतिहासिक पृष्ठभूमि (Historical Background)", "sub": "रेगुलेटिंग एक्ट 1773 से भारतीय स्वतंत्रता अधिनियम 1947 तक", "file": "pdfs/polity/lec23.pdf"}], "history": [], "geography": [], "static_gk": [], "science": [], "economics": []};

    let libraryData = FALLBACK_DATA;
    let activeSubject = "polity";

    function initTheme() {
      if (localStorage.getItem(STORAGE_THEME) === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("themeBtn").textContent = "☀️";
      }
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(STORAGE_THEME, isDark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
    }

    async function loadLibrary() {
      try {
        const res = await fetch("data/pdfs.json", { cache: "no-store" });
        if (res.ok) libraryData = await res.json();
      } catch (e) {
        // Fallback already loaded
      }
      renderSubjectPills();
      renderList();
    }

    function renderSubjectPills() {
      const wrap = document.getElementById("subjectPills");
      wrap.innerHTML = SUBJECTS.map(s => {
        const active = s.key === activeSubject;
        const count = (libraryData[s.key] || []).length;
        return `
          <button onclick="selectSubject('${s.key}')" class="shrink-0 px-4 py-2 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${
            active ? 'bg-blue-600 text-white border-blue-700 shadow-sm' : 'surface-card hover:border-blue-400'
          }">
            <span>${s.icon}</span>
            <span>${s.name}</span>
            ${count > 0 ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${active ? 'bg-white/20' : 'bg-blue-500/15 text-blue-600 dark:text-blue-400'}">${count}</span>` : ''}
          </button>`;
      }).join("");
    }

    function selectSubject(key) {
      activeSubject = key;
      renderSubjectPills();
      renderList();
    }

    function renderList() {
      const grid = document.getElementById("pdfGrid");
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const subObj = SUBJECTS.find(s => s.key === activeSubject);
      document.getElementById("subjectHeading").textContent = `${subObj.icon} ${subObj.name} Class Notes`;

      const items = (libraryData[activeSubject] || []).filter(item => {
        if (!q) return true;
        return `${item.lec} ${item.title} ${item.sub || ''}`.toLowerCase().includes(q);
      });

      document.getElementById("pdfCountBadge").textContent = `${items.length} PDFs`;

      if (!items.length) {
        grid.innerHTML = `
          <div class="col-span-full surface-card rounded-3xl p-10 text-center max-w-md mx-auto">
            <div class="text-4xl mb-2">📂</div>
            <h3 class="font-extrabold text-base mb-1">PDF Notes Jald Hi Aayenge</h3>
            <p class="text-xs" style="color:var(--muted)">Is subject ke class notes abhi upload ho rahe hain.</p>
          </div>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="surface-card rounded-2xl p-5 flex flex-col justify-between hover:border-blue-400 hover:shadow-md transition">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="text-[11px] font-extrabold px-2.5 py-1 rounded-lg bg-blue-500/15 text-blue-600 dark:text-blue-400">
                ${item.lec}
              </span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-rose-500/10 text-rose-600 dark:text-rose-400">
                PDF
              </span>
            </div>
            <h3 class="font-extrabold text-base leading-snug mb-1.5">${item.title}</h3>
            ${item.sub ? `<p class="text-xs font-medium leading-relaxed mb-4" style="color:var(--muted)">${item.sub}</p>` : '<div class="mb-4"></div>'}
          </div>

          <div class="flex gap-2 pt-3 border-t" style="border-color:var(--border)">
            <a href="${item.file}" target="_blank" rel="noopener" class="px-3.5 py-2.5 rounded-xl border text-xs font-extrabold transition hover:opacity-85 flex items-center justify-center gap-1" style="border-color:var(--border); background:var(--surface-2)">
              👁️ Open
            </a>
            <a href="${item.file}" download class="duo-btn flex-1 py-2.5 rounded-xl bg-blue-600 border-blue-800 text-white text-xs font-extrabold flex items-center justify-center gap-1.5">
              📥 Download PDF
            </a>
          </div>
        </div>
      `).join("");
    }

    initTheme();
    loadLibrary();
  </script>
</body>
</html>
